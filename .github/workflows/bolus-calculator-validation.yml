name: Bolus Calculator Validation

on:
  push:
    branches: [auggie-dev-calculator]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bolus-calculator-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer

      - name: Verify unchanged watch calculation and matching phone port
        run: python3 Tests/Tools/check_watch_calculator_parity.py

      - name: Prepare isolated test scheme and simulator
        run: |
          # Dependencies in Pods are committed. No signing, Fastlane, secrets,
          # TestFlight upload, or remote commands are involved in this workflow.
          diff Podfile.lock Pods/Manifest.lock
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import subprocess
          import xml.etree.ElementTree as ET

          schemes = Path('LoopFollow.xcworkspace/xcshareddata/xcschemes')
          scheme = ET.parse(schemes / 'LoopFollow.xcscheme')
          testables = scheme.find('./TestAction/Testables')
          # The historical shared scheme still lists the removed LoopFollowTests
          # target. Keep only the current Tests target in this CI-only scheme.
          for item in list(testables):
              reference = item.find('BuildableReference')
              if reference.get('BlueprintIdentifier') != 'DDCC3AD52DDE1790006F1C10':
                  testables.remove(item)
          assert len(testables) == 1
          scheme.write(schemes / 'LoopFollowCalculatorCI.xcscheme', encoding='UTF-8', xml_declaration=True)

          devices = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))['devices']
          candidates = [
              (tuple(int(n) for n in runtime.split('iOS-')[-1].split('-')), device)
              for runtime, entries in devices.items() if 'iOS-' in runtime
              for device in entries if device['name'].startswith('iPhone') and device.get('isAvailable', True)
          ]
          if not candidates:
              raise SystemExit('No available iPhone simulator')
          device = max(candidates, key=lambda entry: entry[0])[1]
          with open(os.environ['GITHUB_ENV'], 'a') as environment:
              environment.write('CALCULATOR_SIMULATOR_ID=' + device['udid'] + '\n')
          print('Using simulator: ' + device['name'])
          PY

      - name: Build watch simulator target
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace LoopFollow.xcworkspace \
            -scheme LoopFollowWatch \
            -configuration Debug \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build/watch \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' unique_id=CalculatorCI \
            2>&1 | tee watch-build.log

      - name: Build iPhone and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace LoopFollow.xcworkspace \
            -scheme LoopFollowCalculatorCI \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$CALCULATOR_SIMULATOR_ID" \
            -derivedDataPath build/iphone \
            -resultBundlePath CalculatorTests.xcresult \
            -only-testing:Tests \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' \
            DEVELOPMENT_TEAM='' unique_id=CalculatorCI \
            2>&1 | tee iphone-tests.log

      - name: Upload validation results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: bolus-calculator-validation
          path: |
            CalculatorTests.xcresult
            watch-build.log
            iphone-tests.log
          if-no-files-found: ignore
